<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<h1>Lista de Productos</h1>
<a th:href="@{/productos/nuevo}">Nuevo Producto</a> |
<a th:href="@{/categorias}">Categorías</a>

<!-- Consulta JPQL: productos de una categoría con precio mayor a un valor -->
<form class="filtro" onsubmit="return filtrar()">
    <strong>Filtrar:</strong>
    <select id="categoriaId" required>
        <option value="">Categoría...</option>
        <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
    </select>
    <input type="number" id="minimo" min="0" step="0.01" placeholder="Precio mayor a..." required>
    <button type="submit">Buscar</button>
</form>

<table>
    <thead>
    <tr><th>ID</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr>
    </thead>
    <tbody>
    <tr th:each="p : ${productos}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.nombre}"></td>
        <td th:text="${p.categoria.nombre}"></td>
        <td th:text="${p.precio}"></td>
        <td th:text="${p.stock}"></td>
        <td>
            <a th:href="@{/productos/editar/{id}(id=${p.id})}">Editar</a>
            <form th:action="@{/productos/eliminar/{id}(id=${p.id})}" method="post"
                  style="display:inline" onsubmit="return confirm('¿Eliminar este producto?')">
                <button type="submit">Eliminar</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(productos)}">
        <td colspan="6">No hay productos registrados.</td>
    </tr>
    </tbody>
</table>

<script>
    function filtrar() {
        var id = document.getElementById('categoriaId').value;
        var minimo = document.getElementById('minimo').value;
        window.location.href = '/productos/categoria/' + id + '/precio-mayor?minimo=' + minimo;
        return false;
    }
</script>
</body>
</html>
