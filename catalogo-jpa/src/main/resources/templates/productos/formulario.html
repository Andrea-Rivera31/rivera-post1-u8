<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Producto</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<h1 th:text="${producto.id == null} ? 'Nuevo Producto' : 'Editar Producto'"></h1>

<form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
    <input type="hidden" th:field="*{id}">

    <label>Nombre:</label>
    <input type="text" th:field="*{nombre}">
    <span class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>

    <label>Precio:</label>
    <input type="number" step="0.01" th:field="*{precio}">
    <span class="error" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></span>

    <label>Stock:</label>
    <input type="number" th:field="*{stock}">
    <span class="error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></span>

    <label>Categoría:</label>
    <select name="categoriaId" required>
        <option value="">Seleccione...</option>
        <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"
                th:selected="${c.id == categoriaIdSeleccionado}"></option>
    </select>

    <br><br>
    <button type="submit">Guardar</button>
    <a th:href="@{/productos}">Cancelar</a>
</form>
</body>
</html>
